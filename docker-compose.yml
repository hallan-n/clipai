version: "3.9"

services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      - OLLAMA_NUM_THREADS=4
    command: >
      sh -c "
      ollama serve &
      sleep 5 &&
      ollama pull mistral:7b &&
      wait
      "
volumes:
  ollama:
