<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Flowbite -->
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.js"></script>

    <title>ClipAI</title>
</head>

<body class="bg-gray-900 text-gray-200 min-h-screen">

<div class="max-w-[1600px] mx-auto p-6 space-y-8">

    <!-- HEADER -->
    <header>
        <h1 class="text-3xl font-bold ">ClipAI</h1>
        <p class="text-gray-400">Pipeline: vídeo → prompts → processamento</p>
    </header>

    <!-- STEPS -->
    <ol class="flex items-center w-full text-sm font-medium text-gray-400">
        <li id="indicator1" class="flex items-center text-blue-500">
            <span class="flex items-center justify-center w-8 h-8 border border-blue-500 rounded-full mr-2">1</span>
            Vídeo
            <span class="mx-4">→</span>
        </li>
        <li id="indicator2" class="flex items-center">
            <span class="flex items-center justify-center w-8 h-8 border border-gray-500 rounded-full mr-2">2</span>
            Prompts
            <span class="mx-4">→</span>
        </li>
        <li id="indicator3" class="flex items-center">
            <span class="flex items-center justify-center w-8 h-8 border border-gray-500 rounded-full mr-2">3</span>
            Processar
        </li>
    </ol>

    <!-- CONTAINER -->
    <div class="relative overflow-hidden">

        <!-- ================= STEP 1 ================= -->
        <div id="step1"
             class="transition-all duration-500 ease-in-out translate-x-0 opacity-100">

            <section class="rounded-lg border border-gray-700 p-6 space-y-4 max-w-xl">
                <h2 class="text-xl font-semibold">Vídeo</h2>

                <div>
                    <label class="text-sm text-gray-400">URL do vídeo</label>
                    <input id="videoUrl"
                        type="text"
                        placeholder="https://www.youtube.com/watch?v=..."
                        class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 mt-1" />
                </div>

                <button id="fetchButton"
                    onclick="fetchVideoInfo()"
                    class="w-full bg-blue-600 hover:bg-blue-500 rounded-lg py-2 font-semibold">
                    Buscar informações
                </button>

                <div class="border-t border-gray-700 pt-4 space-y-1 text-sm">
                    <p><b>ID:</b> <span id="videoId" class="text-gray-400">-</span></p>
                    <p><b>Título:</b> <span id="videoTitle" class="text-gray-400">-</span></p>
                    <p><b>Canal:</b> <span id="channelTitle" class="text-gray-400">-</span></p>
                    <p><b>Publicado em:</b> <span id="publishedAt" class="text-gray-400">-</span></p>
                    <img id="thumbnail" class="mt-3 h-70 rounded-lg hidden" />
                </div>

                <button id="toStep2"
                    onclick="goToStep(2)"
                    disabled
                    class="w-full bg-gray-700 py-2 rounded-lg opacity-40 cursor-not-allowed">
                    Continuar
                </button>
            </section>
        </div>

        <!-- ================= STEP 2 ================= -->
        <div id="step2"
             class="absolute top-0 left-0 w-full transition-all duration-500 ease-in-out translate-x-full opacity-0">

            <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                <section class="rounded-lg border border-gray-700 p-6">
                    <h2 class="text-xl font-semibold mb-2">Prompt — Títulos</h2>
                    <textarea rows="16"
                        placeholder="Cole aqui o prompt de títulos"
                        class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 resize-none"></textarea>
                </section>

                <section class="rounded-lg border border-gray-700 p-6">
                    <h2 class="text-xl font-semibold mb-2">Prompt — Cortes</h2>
                    <textarea rows="16"
                        placeholder="Cole aqui o prompt de cortes"
                        class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 resize-none"></textarea>
                </section>

                <button onclick="goToStep(3)"
                    class="xl:col-span-2 bg-blue-600 hover:bg-blue-500 py-2 rounded-lg font-semibold">
                    Ir para processamento
                </button>
            </div>
        </div>

        <!-- ================= STEP 3 ================= -->
        <div id="step3"
             class="absolute top-0 left-0 w-full transition-all duration-500 ease-in-out translate-x-full opacity-0">

            <section class="rounded-lg border border-gray-700 p-6 space-y-4 max-w-xl">
                <h2 class="text-xl font-semibold">Processar vídeo</h2>

                <p class="text-sm text-gray-400">
                    O processamento pode levar alguns minutos.
                </p>

                <div id="processing"
                    class="hidden bg-gray-800 border border-gray-700 rounded-lg p-4 text-sm">
                    ⏳ Processando vídeo...
                </div>

                <button id="processBtn"
                    onclick="processVideo()"
                    class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded-lg font-semibold">
                    Processar vídeo
                </button>

                <button id="downloadBtn"
                    onclick="downloadZip()"
                    class="hidden w-full bg-green-600 hover:bg-green-500 py-2 rounded-lg font-semibold">
                    Baixar ZIP
                </button>
            </section>
        </div>

    </div>
</div>

<script>
let currentVideoUrl = ''
let zipBlob = null

function formatDate(d) {
    if (!d || d.length !== 8) return '-'
    return `${d.slice(6,8)}/${d.slice(4,6)}/${d.slice(0,4)}`
}

async function fetchVideoInfo() {
    const url = document.getElementById('videoUrl').value.trim()
    if (!url) return alert('Informe a URL')

    currentVideoUrl = url

    const btn = document.getElementById('fetchButton')
    btn.textContent = 'Buscando...'
    btn.disabled = true

    try {
        const r = await fetch(`http://localhost:8000/video?url=${encodeURIComponent(url)}`)
        const d = await r.json()

        document.getElementById('videoId').textContent = d.video_id ?? '-'
        document.getElementById('videoTitle').textContent = d.title ?? '-'
        document.getElementById('channelTitle').textContent = d.channel_title ?? '-'
        document.getElementById('publishedAt').textContent = formatDate(d.published_at)

        if (d.thumbnail) {
            const img = document.getElementById('thumbnail')
            img.src = d.thumbnail
            img.classList.remove('hidden')
        }

        const next = document.getElementById('toStep2')
        next.disabled = false
        next.classList.remove('opacity-40', 'cursor-not-allowed')
        next.classList.add('bg-blue-600', 'hover:bg-blue-500')

    } catch {
        alert('Erro ao buscar vídeo')
    } finally {
        btn.textContent = 'Buscar informações'
        btn.disabled = false
    }
}

function goToStep(step) {
    const steps = ['step1', 'step2', 'step3']
    const indicators = ['indicator1', 'indicator2', 'indicator3']

    steps.forEach((id, i) => {
        const el = document.getElementById(id)
        el.classList.add('translate-x-full', 'opacity-0')
        if (i + 1 === step) {
            el.classList.remove('translate-x-full', 'opacity-0')
            el.classList.add('translate-x-0', 'opacity-100')
        }
    })

    indicators.forEach((id, i) => {
        const el = document.getElementById(id)
        el.classList.toggle('text-blue-500', i + 1 === step)
        el.classList.toggle('text-green-500', i + 1 < step)
    })
}

async function processVideo() {
    if (!currentVideoUrl) return alert('URL não encontrada')

    document.getElementById('processing').classList.remove('hidden')
    document.getElementById('processBtn').disabled = true

    const r = await fetch(
        `http://localhost:8000/video_full?url=${encodeURIComponent(currentVideoUrl)}`
    )
    zipBlob = await r.blob()

    document.getElementById('processing').classList.add('hidden')
    document.getElementById('downloadBtn').classList.remove('hidden')
}

function downloadZip() {
    const url = URL.createObjectURL(zipBlob)
    const a = document.createElement('a')
    a.href = url
    a.download = 'clips.zip'
    a.click()
    URL.revokeObjectURL(url)
}
</script>

</body>
</html>
